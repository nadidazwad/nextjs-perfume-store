# Self-hosted Attar: Postgres + one-off setup (migrate, seed) + the web server.
# Copy .env.example to .env and set at least BETTER_AUTH_SECRET, ADMIN_EMAIL,
# ADMIN_PASSWORD, NEXT_PUBLIC_APP_URL and POSTGRES_PASSWORD. See docs/deploy/docker.md.
x-database-url: &database-url postgres://attar:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/attar

services:
  db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: attar
      POSTGRES_DB: attar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attar -d attar"]
      interval: 3s
      retries: 20

  setup:
    build: { context: ., target: tools }
    env_file: .env
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: *database-url
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/.data
    depends_on:
      setup: { condition: service_completed_successfully }

volumes:
  db:
  uploads:
